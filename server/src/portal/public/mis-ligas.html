<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tus ligas — Race Control</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- El mismo par de fuentes que el panel y el embed (ver `api/public/index.html`): Oswald para
       títulos y botones, Chivo para el texto. El CSP del portal ya deja pasar fonts.googleapis.com
       y fonts.gstatic.com — ver el header en `portal/server.ts`. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Chivo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <div class="marca"><img src="/icon.svg" alt="" /> Race Control</div>

  <section class="caja ancha">
    <h1>Tus ligas</h1>

    <!-- Aviso de cuota. Lo escribe el servidor, que es quien sabe la fecha de verdad. -->
    <p class="aviso" id="aviso-cuota" hidden></p>

    <div id="lista"></div>
    <p class="muted" id="sin-ligas" hidden>
      Tu cuenta todavía no tiene ninguna liga asociada.
      <span data-si-contacto hidden><span data-contacto>Escribinos</span> y la damos de alta.</span>
      <span data-sin-contacto>Pedísela a quien te dio el acceso.</span>
    </p>
    <button id="btn-logout" class="secundario">Cerrar sesión</button>
  </section>

  <p class="error" id="error" hidden></p>
  <p class="pie">Race Control <span id="version"></span></p>

  <script src="/portal.js"></script>
  <script src="/mis-ligas.js"></script>
</body>
</html>

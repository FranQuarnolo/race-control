<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Race Control</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- El mismo par de fuentes que el panel y el embed (ver `api/public/index.html`): Oswald para
       títulos y botones, Chivo para el texto. El CSP del portal ya deja pasar fonts.googleapis.com
       y fonts.gstatic.com — ver el header en `portal/server.ts`. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Chivo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <div class="marca"><img src="/icon.svg" alt="" /> Race Control</div>

  <form class="caja" id="form">
    <h1>Entrar</h1>
    <p class="muted">Con el usuario y la contraseña que te pasamos.</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus />

    <!-- Las contraseñas que genera el operador vienen con la forma `y6cv-gt2f-n2ky-4khe`: dieciséis
         caracteres con guiones, pensadas para pegar de un mensaje. Enmascaradas y sin forma de
         verlas, un guion de más o un carácter pegado a medias se descubre recién con el "usuario o
         contraseña incorrectos", que no distingue un error de tipeo de una contraseña equivocada. -->
    <label for="password">Contraseña</label>
    <div class="campo-con-boton">
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="button" id="ver-password" aria-pressed="false" aria-label="Mostrar la contraseña" title="Mostrar la contraseña">Ver</button>
    </div>

    <button type="submit">Entrar</button>
    <p class="error" id="error" hidden></p>
  </form>

  <!-- `data-contacto` lo convierte en link al cargar la página (ver `pintarContacto` en portal.js).
       Marcado y no escrito a mano porque la dirección la pone quien despliega, y porque sin
       dirección configurada el renglón que se muestra es el otro — el de abajo— en vez de mandar a
       escribir a ningún lado. -->
  <p class="pie">
    <!-- El que arranca visible es el genérico, no el del link: si el pedido de la dirección no
         vuelve —o el despliegue no la configuró— lo que queda en pantalla sigue siendo verdad.
         Arrancar al revés dejaría un "escribinos" muerto en la peor pantalla posible. -->
    <span data-si-contacto hidden>¿Perdiste la contraseña? <span data-contacto>Escribinos</span> y te pasamos una nueva.<br /></span>
    <span data-sin-contacto>¿Perdiste la contraseña? Pedísela a quien te dio el acceso.<br /></span>
    ¿Todavía no tenés liga? <a href="/">Mirá qué es Race Control</a>.
  </p>

  <script src="/portal.js"></script>
  <script src="/login.js"></script>
</body>
</html>

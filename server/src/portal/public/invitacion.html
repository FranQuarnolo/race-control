<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tu liga — Race Control</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <div class="marca"><img src="/icon.svg" alt="" /> Race Control</div>

  <form class="caja" id="form" hidden>
    <h1>Bienvenido a <span id="nombre-liga"></span></h1>
    <p class="muted">
      Elegí una contraseña y listo: no hay más formularios. Tu usuario es
      <strong id="email-invitado"></strong>.
    </p>

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="new-password" minlength="10" required autofocus />
    <p class="muted">Al menos 10 caracteres. Una frase que te acuerdes sirve mejor que algo corto y raro.</p>

    <button type="submit">Crear mi acceso</button>
    <p class="error" id="error" hidden></p>
  </form>

  <section class="caja" id="vencida" hidden>
    <h1>Este link ya no sirve</h1>
    <p class="muted">
      Las invitaciones valen 48 horas y se usan una sola vez. Pedinos una nueva y seguimos.
    </p>
  </section>

  <script src="/portal.js"></script>
  <script src="/invitacion.js"></script>
</body>
</html>

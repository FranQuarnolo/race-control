<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Race Control">
  <!--
    Marca de Race Control: el semáforo de largada.

    La bandera a cuadros que había antes decía "automovilismo", que es lo que dicen todas las
    demás. El semáforo dice lo que hace ESTE producto: es quien da la largada y quien decide si
    la carrera está en verde. Es además el momento más reconocible del deporte.

    La regla que manda acá es el tamaño chico. A 16x16 px en la pestaña del navegador —y a 26 px
    en la barra del panel— lo único que sobrevive es la masa de color, así que las lámparas ocupan
    casi todo el cuadro y el fondo es apenas la junta entre ellas. Un primer intento tenía las
    lámparas chicas sobre un panel oscuro: en la barra del panel, que ya es oscura, el ícono
    desaparecía y parecía una imagen rota.

    Cuatro lámparas y no diez por lo mismo: a ese tamaño, cinco luces en fila o un damero de 4x4
    se vuelven un gris sin forma. Rojo arriba, verde abajo.

    La paleta no se inventa: son las mismas variables CSS del panel (las de rojo y verde), así
    que el ícono y la interfaz quedan coherentes sin trabajo extra.

    OJO al editar este comentario: un comentario XML no puede contener dos guiones seguidos. Acá
    estaban escritos los nombres de las variables CSS tal cual, con su prefijo, y eso bastó para
    que el SVG dejara de parsear entero. El navegador no avisa: dibuja el ícono de imagen rota,
    que es indistinguible de un 404. Si lo tocás, validalo.
  -->
  <defs>
    <!-- El degradado descentrado hace que la lámpara se lea como una esfera encendida y no como
         un círculo plano. A 16 px no se nota; a 256 es la diferencia entre un ícono y un dibujo. -->
    <radialGradient id="rc-rojo" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffb3b3" />
      <stop offset="0.5" stop-color="#e85b5b" />
      <stop offset="1" stop-color="#a32d2d" />
    </radialGradient>
    <radialGradient id="rc-verde" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#a6f5c8" />
      <stop offset="0.5" stop-color="#35c76e" />
      <stop offset="1" stop-color="#17703d" />
    </radialGradient>
  </defs>

  <!-- El cuadro oscuro no es "el fondo": es el cuerpo del semáforo, y lo que se ve de él es la
       junta entre las cuatro lámparas. -->
  <rect width="256" height="256" rx="54" fill="#0c0f15" />

  <!-- Fila de arriba: rojo. La parrilla formada, esperando. -->
  <circle cx="76" cy="76" r="44" fill="url(#rc-rojo)" />
  <circle cx="180" cy="76" r="44" fill="url(#rc-rojo)" />

  <!-- Fila de abajo: verde. Largada dada, carrera en curso. -->
  <circle cx="76" cy="180" r="44" fill="url(#rc-verde)" />
  <circle cx="180" cy="180" r="44" fill="url(#rc-verde)" />
</svg>
